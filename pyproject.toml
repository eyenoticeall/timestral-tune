[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "timestral-tune"
dynamic = ["version"]
description = "Fine-tuning, selective LoRA, and conformal calibration for Mistral's Timestral time-series foundation models in PyTorch."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/timestral_tune/_vendor/timestral/LICENSE"]
requires-python = ">=3.10"
keywords = ["time-series", "forecasting", "fine-tuning", "lora", "conformal-prediction", "timestral"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core dependencies are exactly what the vendored upstream package imports (same floors as upstream).
# Dataframe libraries are added as extras when the data layer lands (Phase 1).
dependencies = [
    "huggingface_hub>=0.23",
    "numpy>=1.24",
    "safetensors>=0.4",
    "torch>=2.4",
]

[project.optional-dependencies]
# Optional Lacuna integration (handoff §7.5). Lacuna itself requires Python 3.11+.
lacuna = ["lacuna-quant>=0.14.1; python_version >= '3.11'"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.version]
path = "src/timestral_tune/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/timestral_tune"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "docs", "README.md", "NOTICE", "LICENSE", "timestral_tune_handoff_document.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "acceptance: one of the acceptance tests T1-T14 from handoff §9",
    "network: needs to download released checkpoints from the Hugging Face Hub",
]

[tool.ruff]
line-length = 120
target-version = "py310"
# Vendored upstream code is generated by scripts/vendor_upstream.py and is never linted or reformatted.
# Markdown is excluded so that code examples in the docs are not reformatted.
extend-exclude = ["src/timestral_tune/_vendor", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
