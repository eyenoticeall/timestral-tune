name: Upstream drift

# Compares the vendored copy of mistralai/timestral with upstream `main`.
# A failure means upstream moved; follow docs/UPSTREAM.md. It does not mean this repo is broken.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_upstream_drift.py
